<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Foundever Responses</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app">
    <!-- Main View -->
    <div id="main-view" class="view">
      <header class="header">
        <div class="logo-container">
          <img src="../icons/icon48.png" alt="Logo" class="logo">
          <h1>Foundever Responses</h1>
        </div>
      </header>

      <div class="search-container">
        <input type="text" id="search-input" placeholder="Search snippets..." autocomplete="off" class="input">
        <span class="search-icon">🔍</span>
      </div>

      <main id="snippets-list" class="snippets-list">
        <!-- Snippet items injected here -->
      </main>

      <footer class="footer-actions">
        <input type="file" id="import-input" accept=".json" style="display:none;">
        <button id="import-btn" class="btn btn-secondary" title="Import Snippets">⬇️ Import</button>
        <button id="export-btn" class="btn btn-secondary" title="Export Snippets">⬆️ Export</button>
        <button id="add-btn" class="btn btn-primary" title="Add new snippet">+ Add</button>
      </footer>
    </div>

    <!-- Add/Edit Snippet View -->
    <div id="edit-view" class="view hidden">
      <header class="header">
        <button id="back-btn" class="btn-icon" title="Back">← Back</button>
        <h2 id="modal-title">Add Snippet</h2>
        <div style="width:40px;"></div>
      </header>

      <form id="snippet-form" class="edit-form">
        <div class="form-group">
          <label for="snippet-title">Title</label>
          <input type="text" id="snippet-title" class="input" placeholder="e.g., Thank You" required>
        </div>

        <div class="form-group">
          <label for="snippet-shortcut">Shortcut</label>
          <div class="input-wrapper">
            <span class="shortcut-prefix">.</span>
            <input type="text" id="snippet-shortcut" class="input" placeholder="hello" required autocomplete="off">
          </div>
          <small class="hint">Letters and numbers only. Type <strong id="example-hint">.hello</strong> to insert.</small>
        </div>

        <div class="form-group">
          <label for="snippet-content">Expanded Text</label>
          <textarea id="snippet-content" class="input textarea" placeholder="Type the full response here..." rows="6"
            required></textarea>
        </div>

        <div class="form-group">
          <label for="snippet-category">Category</label>
          <select id="snippet-category" class="input select">
            <option value="general">General</option>
            <option value="greeting">Greeting</option>
            <option value="troubleshooting">Troubleshooting</option>
            <option value="escalation">Escalation</option>
            <option value="closing">Closing</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="button" id="delete-btn" class="btn btn-danger hidden">Delete</button>
          <button type="submit" class="btn btn-primary btn-wide">Save Snippet</button>
        </div>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
