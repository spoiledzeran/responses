<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foundever Responses</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Foundever Responses</h1>
      <p class="subtitle">Canned responses for customer service</p>
    </header>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search snippets..." autocomplete="off">
      <button id="add-btn" class="btn-primary">+ New</button>
    </div>

    <div id="snippets-list" class="snippets-list">
      <!-- Snippets will be loaded here -->
    </div>

    <div class="footer">
      <button id="export-btn" class="btn-secondary">Export</button>
      <button id="import-btn" class="btn-secondary">Import</button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">New Snippet</h2>
      <form id="snippet-form">
        <div class="form-group">
          <label for="snippet-title">Title</label>
          <input type="text" id="snippet-title" required placeholder="e.g., Thank You">
        </div>
        <div class="form-group shortcut-group">
          <label for="snippet-shortcut">Shortcut</label>
          <div class="shortcut-field">
            <span class="dot">.</span>
            <input type="text" id="snippet-shortcut" required placeholder="e.g., hello" autocomplete="off">
          </div>
          <small>No spaces. Type <strong id="example-hint">.hello</strong> in any text field to insert the response.</small>
        </div>
        <div class="form-group content-group">
          <label for="snippet-content">Response</label>
          <textarea id="snippet-content" required placeholder="Enter your canned response..."></textarea>
        </div>
        <div class="form-group">
          <label for="snippet-category">Category</label>
          <select id="snippet-category">
            <option value="general">General</option>
            <option value="greeting">Greeting</option>
            <option value="troubleshooting">Troubleshooting</option>
            <option value="escalation">Escalation</option>
            <option value="closing">Closing</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
